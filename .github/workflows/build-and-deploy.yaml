# Workflow for repos that build Docker images and deploy via the deployer API.
#
# Org secrets required:
#   DEPLOYER_STAGING_URL
#   DEPLOYER_STAGING_WEBHOOK_SECRET
#   DEPLOYER_PRODUCTION_URL
#   DEPLOYER_PRODUCTION_WEBHOOK_SECRET
#   DEPLOYER_PROXY (optional)

name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: environment
        required: true
      service:
        description: Compose service to deploy
        type: choice
        required: true
        default: all
        options:
          - all
          - music-room-api
          - music-room-bot
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-api:
    name: Build and push API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      imageid: ${{ steps.build.outputs.digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/one-zero-eight/music-room-api

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}"
          file: ./api.Dockerfile
          push: ${{ github.repository_owner == 'one-zero-eight' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/one-zero-eight/music-room-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-bot:
    name: Build and push Bot image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      imageid: ${{ steps.build.outputs.digest }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/one-zero-eight/music-room-bot

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}"
          file: ./bot.Dockerfile
          push: ${{ github.repository_owner == 'one-zero-eight' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/one-zero-eight/music-room-bot:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-api, build-bot]
    if: github.repository_owner == 'one-zero-eight'
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
    concurrency:
      group: deploy-${{ github.event.inputs.environment || 'staging' }}
      cancel-in-progress: false

    steps:
      - name: Deploy via deployer API
        env:
          DEPLOYER_URL: ${{ github.event.inputs.environment == 'production' && secrets.DEPLOYER_PRODUCTION_URL || secrets.DEPLOYER_STAGING_URL }}
          WEBHOOK_SECRET: ${{ github.event.inputs.environment == 'production' && secrets.DEPLOYER_PRODUCTION_WEBHOOK_SECRET || secrets.DEPLOYER_STAGING_WEBHOOK_SECRET }}
          DEPLOYER_PROXY: ${{ secrets.DEPLOYER_PROXY }}
          REPOSITORY: ${{ github.repository }}
          API_IMAGE_ID: ${{ needs.build-api.outputs.imageid }}
          BOT_IMAGE_ID: ${{ needs.build-bot.outputs.imageid }}
          REF: ${{ github.ref_name }}
          SERVICE: ${{ github.event.inputs.service || 'all' }}
        run: |
          set -euo pipefail

          deploy_log="$(mktemp)"
          trap 'rm -f "$deploy_log"' EXIT

          curl_args=(
            -fNSs
            --no-progress-meter
            --connect-timeout 10
            -H "Authorization: Bearer ${WEBHOOK_SECRET}"
            -H "Content-Type: application/json"
            -X POST
          )

          if [[ -n "${DEPLOYER_PROXY:-}" ]]; then
            curl_args+=(--proxy "${DEPLOYER_PROXY}")
          fi

          deploy_service() {
            local image_id="$1" service="$2"
            echo "=== Deploying service: $service ==="
            jq -cn \
              --arg image_id "$image_id" \
              --arg ref "$REF" \
              --arg service "$service" \
              '{image_id: $image_id, ref: $ref, services: [$service]}' |
            curl "${curl_args[@]}" \
              "${DEPLOYER_URL}/deploy?repository=${REPOSITORY}" \
              -d @- |
            tee "$deploy_log"

            if ! grep -q 'Deployment completed successfully' "$deploy_log"; then
              echo "Deployment of $service did not complete successfully" >&2
              exit 1
            fi
          }

          case "$SERVICE" in
            music-room-api)
              deploy_service "$API_IMAGE_ID" "music-room-api"
              ;;
            music-room-bot)
              deploy_service "$BOT_IMAGE_ID" "music-room-bot"
              ;;
            all)
              deploy_service "$API_IMAGE_ID" "music-room-api"
              deploy_service "$BOT_IMAGE_ID" "music-room-bot"
              ;;
          esac
