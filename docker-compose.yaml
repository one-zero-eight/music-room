# This is a Docker Compose configuration for local use.

# Run all services:
# docker compose up --build --wait

services:
  bot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    restart: no
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
      prefect-server:
        condition: service_healthy
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro" # Read-only settings file
    environment:
      TZ: Europe/Moscow # Set the timezone for correct calendar image generation
      PREFECT_API_URL: http://prefect-server:4200/api # Prefect API for the notification scheduler
    deploy:
      # Change limits if project needs more RAM, though try to stay within limits
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    restart: no
    depends_on:
      db:
        condition: service_healthy
      alembic-migrate:
        condition: service_completed_successfully
      prefect-server:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro" # Read-only settings file
    environment:
      TZ: Europe/Moscow # Set the timezone for correct calendar image generation
      PREFECT_API_URL: http://prefect-server:4200/api # Prefect API for the booking-notifications flow
    deploy:
      # Change limits if project needs more RAM, though try to stay within limits
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 500m

  alembic-migrate:
    build:
      context: .
      dockerfile: api.Dockerfile
    restart: no
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "./settings.yaml:/app/settings.yaml:ro" # Read-only settings file
    command: alembic upgrade head

  db:
    # See more: https://hub.docker.com/_/postgres
    image: "postgres:17.1"
    restart: no
    ports:
      - "5432:5432"
    volumes:
      - "postgres:/var/lib/postgresql/data"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      timeout: 5s
      start_period: 30s
      interval: 1m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

  redis:
    # See more: https://hub.docker.com/_/redis
    image: "redis:7.2.4-alpine"
    restart: no
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
    ports:
      - "6379:6379"
    volumes:
      - "redis:/data"
      - "./redis/redis.conf:/usr/local/etc/redis/redis.conf"

  prefect-server:
    # Orchestrates the notification flows. Keep the tag in sync with the `prefect` version in pyproject.toml.
    image: "prefecthq/prefect:3.8.4-python3.13"
    restart: no
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - "prefect:/root/.prefect" # SQLite metadata DB; point at Postgres later if needed
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres:
  redis:
  prefect:
